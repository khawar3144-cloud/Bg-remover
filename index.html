<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All in One Image Editor - Bg Remover & Passport Photo</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;text-align:center;padding:15px}
.box{background:#fff;max-width:520px;margin:auto;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
button{padding:10px 18px;border:none;border-radius:8px;background:#007bff;color:#fff;margin:5px;cursor:pointer}
#preview{max-width:100%;margin-top:15px;border:1px solid #ddd;border-radius:10px}
.controls{margin-top:15px;background:#f9f9f9;padding:12px;border-radius:10px;text-align:left}
label{font-weight:bold;display:block;margin-top:12px}
input[type="color"],input[type="range"]{width:100%}
</style>
</head>
<body>
<div class="box">
<h2>All in One Image Editor</h2>
<p>بیک گراؤنڈ ریموو + کلر چینج + بلر + پاسپورٹ فوٹو</p>
<input type="file" id="upload" accept="image/*">
<div id="loading" style="display:none;color:red;font-weight:bold;margin-top:10px;">پروسیسنگ ہو رہی ہے...</div>
<img id="preview" style="display:none;">
<canvas id="canvas" style="display:none;"></canvas>
<div id="controls" class="controls" style="display:none;">
<label>بیک گراؤنڈ ریموو کریں:</label>
<button onclick="removeBg()">بیک گراؤنڈ ہٹائیں</button>
<label>بیک گراؤنڈ کلر بدلیں:</label>
<div>
<button style="background:white;color:black;border:1px solid #000" onclick="changeBg('white')">سفید</button>
<button style="background:black" onclick="changeBg('black')">کالا</button>
<button style="background:blue" onclick="changeBg('#0b57d0')">نیلا</button>
<button style="background:red" onclick="changeBg('red')">لال</button>
<button style="background:#00a884" onclick="changeBg('transparent')">ٹرانسپیرنٹ</button>
</div>
<input type="color" id="customColor" onchange="changeBg(this.value)">
<label>بیک گراؤنڈ بلر:</label>
<input type="range" id="blur" min="0" max="20" value="0" oninput="redraw()">
<label>تصویر کا سائز:</label>
<input type="range" id="zoom" min="20" max="200" value="100" oninput="redraw()">
<br><br>
<button style="background:#28a745;width:100%" onclick="download()">ڈاؤن لوڈ کریں</button>
</div>
</div>
<script type="module">
import {removeBackground} from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm';
let orig=null, noBg=null, bg='transparent';
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const preview=document.getElementById('preview');
document.getElementById('upload').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader(); r.onload=ev=>{
  orig=new Image(); orig.onload=()=>{canvas.width=orig.width; canvas.height=orig.height; ctx.drawImage(orig,0,0); preview.src=canvas.toDataURL(); preview.style.display='block'; document.getElementById('controls').style.display='block';}; orig.src=ev.target.result;
 }; r.readAsDataURL(f);
});
window.removeBg=async()=>{
 document.getElementById('loading').style.display='block';
 const blob=await removeBackground(canvas.toDataURL());
 const url=URL.createObjectURL(blob);
 noBg=new Image(); noBg.onload=()=>{ canvas.width=noBg.width; canvas.height=noBg.height; redraw(); document.getElementById('loading').style.display='none';}; noBg.src=url;
}
window.changeBg=c=>{bg=c; redraw();}
window.redraw=()=>{
 if(!orig) return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(bg!=='transparent'){ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);}
 const b=document.getElementById('blur').value;
 if(b>0){ctx.filter=`blur(${b}px)`; ctx.drawImage(orig,0,0); ctx.filter='none'; if(noBg) ctx.drawImage(noBg,0,0);} else { if(noBg) ctx.drawImage(noBg,0,0); else ctx.drawImage(orig,0,0); }
 preview.src=canvas.toDataURL();
 const z=document.getElementById('zoom').value; preview.style.width=z+'%';
}
window.download=()=>{const a=document.createElement('a'); a.download='edited-image.png'; a.href=canvas.toDataURL(); a.click();}
</script>
</body>
</html>
